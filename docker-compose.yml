services:
  backend-api-zoho-senitron:
    build:
      context: ./backend_app
    container_name: backend-api-zoho-senitron
    restart: unless-stopped
    image: robertocnws/backend-api-zoho-senitron:latest
    cap_add:
      - SYS_TIME
    volumes:
      - ./backend_app:/app
      - ./backend_app/nginx_gunicorn/gunicorn.conf.py:/etc/nginx/gunicorn.conf.py
      - ./backend_app/local_backup:/app/backup
      - ./backend_app/static:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - ./backend_app/.env
    networks:
      - api-zoho-senitron-network
    environment:
      - TZ=America/New_York
    depends_on:
      - redis-api-zoho-senitron

  ms-main-load-data:
    build:
      context: ./api_ms_main_load_auth/app
      dockerfile: Dockerfile
    container_name: ms-main-load-data
    restart: unless-stopped
    volumes:
      - ./api_ms_main_load_auth/app:/app
      - ./api_ms_main_load_auth/app/ms_main_load_data/gunicorn.conf.py:/etc/nginx/gunicorn.conf.py
      - ./api_ms_main_load_auth/app/static:/app/staticfiles
    ports:
      - "8005:8005"
    depends_on:
      - mongodb-main-load-data
      - redis-api-zoho-senitron
    env_file:
      - ./api_ms_main_load_auth/app/.env
    networks:
      - api-zoho-senitron-network

  mongodb-main-load-data:
    build:
      context: ./api_ms_main_load_auth/mongo_db
    container_name: mongodb-main-load-data
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - ./api_ms_main_load_auth/mongo_db/.env
    volumes:
      - mongodb_data:/data/db
      - ./api_ms_main_load_auth/mongo_db/init:/docker-entrypoint-initdb.d
    networks:
      - api-zoho-senitron-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '1.0'
          memory: 2g

  mongoexpress-main-load-data:
    image: mongo-express:latest
    container_name: mongoexpress-main-load-data
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ./api_ms_main_load_auth/mongo_express/.env
    depends_on:
      - mongodb-main-load-data
    networks:
      - api-zoho-senitron-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
        reservations:
          cpus: '0.25'
          memory: 256m

  postgres-api-zoho-senitron:
    image: postgres:16.0
    container_name: postgres-api-zoho-senitron
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/scripts_db:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=api_zoho_senitron_qa_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5442:5432"
    networks:
      - api-zoho-senitron-network

  nginx-api-zoho-senitron:
    build:
      context: ./nginx
    container_name: nginx-api-zoho-senitron
    restart: unless-stopped
    image: robertocnws/nginx-api-zoho-senitron:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certificates:/etc/nginx/certificates:ro
      - ./frontend_app/build:/usr/share/nginx/html
      - ./backend_app/static:/usr/share/nginx/html_backend
      - ./api_ms_main_load_auth/app/static:/usr/share/nginx/html_ms_main_load_auth
    depends_on:
      - backend-api-zoho-senitron
    networks:
      - api-zoho-senitron-network

  redis-api-zoho-senitron:
    image: redis:latest
    container_name: redis-api-zoho-senitron
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - api-zoho-senitron-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  api-zoho-senitron-network:
    driver: bridge