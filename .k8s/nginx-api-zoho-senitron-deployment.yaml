apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Program Files\Kompose\kompose.exe convert --out .k8s
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: nginx-api-zoho-senitron
  name: nginx-api-zoho-senitron
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: nginx-api-zoho-senitron
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Program Files\Kompose\kompose.exe convert --out .k8s
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: nginx-api-zoho-senitron
    spec:
      containers:
        - image: robertocnws/nginx-api-zoho-senitron:latest
          name: nginx-api-zoho-senitron
          ports:
            - containerPort: 80
              protocol: TCP
            - containerPort: 443
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/nginx/nginx.conf
              name: nginx-api-zoho-senitron-cm0
              readOnly: true
              subPath: nginx.conf
            - mountPath: /usr/share/nginx/html
              name: nginx-api-zoho-senitron-cm2
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: nginx.conf
                path: nginx.conf
            name: nginx-api-zoho-senitron-cm0
          name: nginx-api-zoho-senitron-cm0
        - configMap:
            name: nginx-api-zoho-senitron-cm2
          name: nginx-api-zoho-senitron-cm2
