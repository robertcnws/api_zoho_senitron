apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Program Files\Kompose\kompose.exe convert --out .k8s
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: backend-api-zoho-senitron
  name: backend-api-zoho-senitron
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend-api-zoho-senitron
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Program Files\Kompose\kompose.exe convert --out .k8s
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: backend-api-zoho-senitron
    spec:
      containers:
        - env:
            - name: DB_ENGINE
              valueFrom:
                configMapKeyRef:
                  key: DB_ENGINE
                  name: backend-api-zoho-senitron-env
            - name: DB_HOST_DEV
              valueFrom:
                configMapKeyRef:
                  key: DB_HOST_DEV
                  name: backend-api-zoho-senitron-env
            - name: DB_HOST_PROD
              valueFrom:
                configMapKeyRef:
                  key: DB_HOST_PROD
                  name: backend-api-zoho-senitron-env
            - name: DB_HOST_QA
              valueFrom:
                configMapKeyRef:
                  key: DB_HOST_QA
                  name: backend-api-zoho-senitron-env
            - name: DB_NAME_DEV
              valueFrom:
                configMapKeyRef:
                  key: DB_NAME_DEV
                  name: backend-api-zoho-senitron-env
            - name: DB_NAME_PROD
              valueFrom:
                configMapKeyRef:
                  key: DB_NAME_PROD
                  name: backend-api-zoho-senitron-env
            - name: DB_NAME_QA
              valueFrom:
                configMapKeyRef:
                  key: DB_NAME_QA
                  name: backend-api-zoho-senitron-env
            - name: DB_PASSWORD_DEV
              valueFrom:
                configMapKeyRef:
                  key: DB_PASSWORD_DEV
                  name: backend-api-zoho-senitron-env
            - name: DB_PASSWORD_PROD
              valueFrom:
                configMapKeyRef:
                  key: DB_PASSWORD_PROD
                  name: backend-api-zoho-senitron-env
            - name: DB_PASSWORD_QA
              valueFrom:
                configMapKeyRef:
                  key: DB_PASSWORD_QA
                  name: backend-api-zoho-senitron-env
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  key: DB_PORT
                  name: backend-api-zoho-senitron-env
            - name: DB_USER_DEV
              valueFrom:
                configMapKeyRef:
                  key: DB_USER_DEV
                  name: backend-api-zoho-senitron-env
            - name: DB_USER_PROD
              valueFrom:
                configMapKeyRef:
                  key: DB_USER_PROD
                  name: backend-api-zoho-senitron-env
            - name: DB_USER_QA
              valueFrom:
                configMapKeyRef:
                  key: DB_USER_QA
                  name: backend-api-zoho-senitron-env
            - name: DJANGO_SETTINGS_MODULE
              valueFrom:
                configMapKeyRef:
                  key: DJANGO_SETTINGS_MODULE
                  name: backend-api-zoho-senitron-env
            - name: DJANGO_SUPERUSER_EMAIL
              valueFrom:
                configMapKeyRef:
                  key: DJANGO_SUPERUSER_EMAIL
                  name: backend-api-zoho-senitron-env
            - name: DJANGO_SUPERUSER_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: DJANGO_SUPERUSER_PASSWORD
                  name: backend-api-zoho-senitron-env
            - name: DJANGO_SUPERUSER_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: DJANGO_SUPERUSER_USERNAME
                  name: backend-api-zoho-senitron-env
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  key: ENVIRONMENT
                  name: backend-api-zoho-senitron-env
            - name: FRONTEND_URL_DEV
              valueFrom:
                configMapKeyRef:
                  key: FRONTEND_URL_DEV
                  name: backend-api-zoho-senitron-env
            - name: FRONTEND_URL_DEVOPS
              valueFrom:
                configMapKeyRef:
                  key: FRONTEND_URL_DEVOPS
                  name: backend-api-zoho-senitron-env
            - name: FRONTEND_URL_PROD
              valueFrom:
                configMapKeyRef:
                  key: FRONTEND_URL_PROD
                  name: backend-api-zoho-senitron-env
            - name: FRONTEND_URL_QA
              valueFrom:
                configMapKeyRef:
                  key: FRONTEND_URL_QA
                  name: backend-api-zoho-senitron-env
            - name: LOGINUSER_EMAIL
              valueFrom:
                configMapKeyRef:
                  key: LOGINUSER_EMAIL
                  name: backend-api-zoho-senitron-env
            - name: LOGINUSER_PASSWORD
              valueFrom:
                configMapKeyRef:
                  key: LOGINUSER_PASSWORD
                  name: backend-api-zoho-senitron-env
            - name: LOGINUSER_USERNAME
              valueFrom:
                configMapKeyRef:
                  key: LOGINUSER_USERNAME
                  name: backend-api-zoho-senitron-env
            - name: PATH_FROM_BACKUP_DB_DEV
              valueFrom:
                configMapKeyRef:
                  key: PATH_FROM_BACKUP_DB_DEV
                  name: backend-api-zoho-senitron-env
            - name: PATH_FROM_BACKUP_DB_PROD
              valueFrom:
                configMapKeyRef:
                  key: PATH_FROM_BACKUP_DB_PROD
                  name: backend-api-zoho-senitron-env
            - name: PATH_FROM_BACKUP_DB_QA
              valueFrom:
                configMapKeyRef:
                  key: PATH_FROM_BACKUP_DB_QA
                  name: backend-api-zoho-senitron-env
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  key: REDIS_HOST
                  name: backend-api-zoho-senitron-env
            - name: TZ
              value: America/New_York
            - name: ZOHO_INVENTORY_ITEMS_URL
              valueFrom:
                configMapKeyRef:
                  key: ZOHO_INVENTORY_ITEMS_URL
                  name: backend-api-zoho-senitron-env
            - name: ZOHO_INVENTORY_PURCHASERECEIVES_URL
              valueFrom:
                configMapKeyRef:
                  key: ZOHO_INVENTORY_PURCHASERECEIVES_URL
                  name: backend-api-zoho-senitron-env
            - name: ZOHO_INVENTORY_SALESORDERS_URL
              valueFrom:
                configMapKeyRef:
                  key: ZOHO_INVENTORY_SALESORDERS_URL
                  name: backend-api-zoho-senitron-env
            - name: ZOHO_INVENTORY_SHIPMENTORDERS_URL
              valueFrom:
                configMapKeyRef:
                  key: ZOHO_INVENTORY_SHIPMENTORDERS_URL
                  name: backend-api-zoho-senitron-env
            - name: ZOHO_INVENTORY_SHIPMENTS_URL
              valueFrom:
                configMapKeyRef:
                  key: ZOHO_INVENTORY_SHIPMENTS_URL
                  name: backend-api-zoho-senitron-env
            - name: ZOHO_SCOPES
              valueFrom:
                configMapKeyRef:
                  key: ZOHO_SCOPES
                  name: backend-api-zoho-senitron-env
          image: robertocnws/backend-api-zoho-senitron:latest
          name: backend-api-zoho-senitron
          ports:
            - containerPort: 8000
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - SYS_TIME
          volumeMounts:
            - mountPath: /app
              name: backend-api-zoho-senitron-cm0
            - mountPath: /etc/nginx/gunicorn.conf.py
              name: backend-api-zoho-senitron-cm1
              subPath: gunicorn.conf.py
            - mountPath: /app/backup
              name: backend-api-zoho-senitron-claim2
      restartPolicy: Always
      volumes:
        - configMap:
            name: backend-api-zoho-senitron-cm0
          name: backend-api-zoho-senitron-cm0
        - configMap:
            items:
              - key: gunicorn.conf.py
                path: gunicorn.conf.py
            name: backend-api-zoho-senitron-cm1
          name: backend-api-zoho-senitron-cm1
        - name: backend-api-zoho-senitron-claim2
          persistentVolumeClaim:
            claimName: backend-api-zoho-senitron-claim2
