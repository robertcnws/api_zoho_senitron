apiVersion: v1
binaryData:
  requirements.txt: 
data:
  .env: |-
    DJANGO_SETTINGS_MODULE=api_project_zoho_senitron.settings
    DJANGO_SUPERUSER_USERNAME=admin
    DJANGO_SUPERUSER_EMAIL=admin@example.com
    DJANGO_SUPERUSER_PASSWORD=admin
    LOGINUSER_USERNAME=test
    LOGINUSER_EMAIL=test@example.com
    LOGINUSER_PASSWORD=Hialeah2024*-

    ZOHO_SCOPES=ZohoInventory.items.READ,ZohoInventory.shipmentorders.READ,ZohoInventory.purchasereceives.READ,ZohoInventory.salesorders.READ
    ZOHO_INVENTORY_ITEMS_URL=https://www.zohoapis.com/inventory/v1/items
    ZOHO_INVENTORY_SHIPMENTORDERS_URL=https://www.zohoapis.com/inventory/v1/shipmentorders
    ZOHO_INVENTORY_PURCHASERECEIVES_URL=https://www.zohoapis.com/inventory/v1/purchasereceives
    ZOHO_INVENTORY_SALESORDERS_URL=https://www.zohoapis.com/inventory/v1/salesorders
    ZOHO_INVENTORY_SHIPMENTS_URL=https://inventory.zoho.com/api/v1/shipmentorders

    # ENVIRONMENT: DEV
    DB_NAME_DEV=api_zoho_senitron_qa_db
    DB_USER_DEV=postgres
    DB_PASSWORD_DEV=postgres
    DB_HOST_DEV=postgres-api-zoho-senitron
    FRONTEND_URL_DEV=http://localhost:3000
    FRONTEND_URL_DEVOPS=https://10.1.10.216
    PATH_FROM_BACKUP_DB_DEV=/app/backup

    # ENVIRONMENT: QA
    DB_NAME_QA=api_zoho_senitron_qa_db
    DB_USER_QA=postgres
    DB_PASSWORD_QA=postgres
    DB_HOST_QA=postgres-api-zoho-senitron
    FRONTEND_URL_QA=https://api-zoho-senitron.nws.home
    PATH_FROM_BACKUP_DB_QA=/app/backup

    # ENVIRONMENT: PROD
    DB_NAME_PROD=api_zoho_senitron_prod_db
    DB_USER_PROD=postgres
    DB_PASSWORD_PROD=postgres
    DB_HOST_PROD=postgres-api-zoho-senitron
    FRONTEND_URL_PROD=https://api-zoho-senitron.nws.home
    PATH_FROM_BACKUP_DB_PROD=/app/backup

    DB_PORT=5432
    DB_ENGINE=django.db.backends.postgresql

    REDIS_HOST=redis-api-zoho-senitron

    # ENVIRONMENT
    ENVIRONMENT=DEV
  Dockerfile: |-
    FROM python:3.12

    ENV PYTHONUNBUFFERED 1
    ENV PYTHONPATH=/app

    WORKDIR /app

    COPY requirements.txt /app/

    RUN pip install --upgrade pip
    RUN pip install gunicorn
    RUN pip install uvicorn
    RUN pip install -r requirements.txt

    # Instalar herramientas necesarias incluyendo cron
    RUN apt-get update && apt-get install -y wget gnupg2 lsb-release

    # Agregar repositorio de PostgreSQL
    RUN wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | apt-key add -
    RUN echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | tee /etc/apt/sources.list.d/pgdg.list

    # Actualizar e instalar dependencias
    RUN apt-get update && apt-get install -y postgresql-client-16

    # Copia el contenido del directorio al contenedor
    COPY . /app/

    # Expose port 8000 for the Django application
    EXPOSE 8000

    # Ejecuta el script de inicialización y luego arranca Gunicorn y cron
    # CMD ["sh", "-c", "python manage.py makemigrations && python manage.py migrate && python manage.py collectstatic --no-input && python init_scripts.py && gunicorn --bind 0.0.0.0:8000 api_project_zoho_senitron.asgi:application"]
    CMD ["sh", "-c", "python manage.py makemigrations && python manage.py migrate && python manage.py collectstatic --no-input && python init_scripts.py && gunicorn api_project_zoho_senitron.asgi:application -w 3 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000"]
  init_scripts.py: |
    import os
    import django

    os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'api_project_zoho_senitron.settings')
    django.setup()

    from django.core.management import call_command
    from api_zoho.models import LoginUser

    def create_superuser():
        username = os.getenv('DJANGO_SUPERUSER_USERNAME')
        email = os.getenv('DJANGO_SUPERUSER_EMAIL')
        password = os.getenv('DJANGO_SUPERUSER_PASSWORD')

        if not LoginUser.objects.filter(username=username).exists():
            print("Creating superuser...")
            call_command('createsuperuser', '--noinput', '--username', username)
            user = LoginUser.objects.get(username=username)
            user.set_password(password)
            user.email = email
            user.save()
            print("Superuser created!")

    def create_loginuser():
        username = os.getenv('LOGINUSER_USERNAME')
        email = os.getenv('LOGINUSER_EMAIL')
        password = os.getenv('LOGINUSER_PASSWORD')

        if not LoginUser.objects.filter(username=username).exists():
            print("Creating LoginUser...")
            LoginUser.objects.create_user(username=username, email=email, password=password, is_staff=True)
            print("LoginUser created!")

    if __name__ == "__main__":
        create_superuser()
        create_loginuser()
  manage.py: |
    #!/usr/bin/env python
    """Django's command-line utility for administrative tasks."""
    import os
    import sys


    def main():
        """Run administrative tasks."""
        os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'api_project_zoho_senitron.settings')
        try:
            from django.core.management import execute_from_command_line
        except ImportError as exc:
            raise ImportError(
                "Couldn't import Django. Are you sure it's installed and "
                "available on your PYTHONPATH environment variable? Did you "
                "forget to activate a virtual environment?"
            ) from exc
        execute_from_command_line(sys.argv)


    if __name__ == '__main__':
        main()
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: backend-api-zoho-senitron
  name: backend-api-zoho-senitron-cm0
