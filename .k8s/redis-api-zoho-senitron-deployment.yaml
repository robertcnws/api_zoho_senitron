apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Program Files\Kompose\kompose.exe convert --out .k8s
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: redis-api-zoho-senitron
  name: redis-api-zoho-senitron
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis-api-zoho-senitron
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Program Files\Kompose\kompose.exe convert --out .k8s
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: redis-api-zoho-senitron
    spec:
      containers:
        - image: redis:latest
          name: redis-api-zoho-senitron
          volumeMounts:
            - mountPath: /data
              name: redis-data
      restartPolicy: Always
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
