apiVersion: v1
data:
  nginx.conf: "user nginx;\nworker_processes  1;\n\nerror_log  /var/log/nginx/error.log warn;\npid        /var/run/nginx.pid;\n\nevents {\n    worker_connections  1024;\n}\n\nhttp {\n    include       /etc/nginx/mime.types;\n    default_type  application/octet-stream;\n\n    log_format  main  '$remote_addr - $remote_user [$time_local] \"$request\" '\n                      '$status $body_bytes_sent \"$http_referer\" '\n                      '\"$http_user_agent\" \"$http_x_forwarded_for\"';\n\n    access_log  /var/log/nginx/access.log  main;\n\n    sendfile        on;\n    tcp_nopush     on;\n    keepalive_timeout  65;\n    client_max_body_size 100M;\n    proxy_headers_hash_max_size 1024;\n    proxy_headers_hash_bucket_size 128;\n    types_hash_max_size 2048;\n\n    include /etc/nginx/conf.d/*.conf;\n    include /etc/nginx/sites-enabled/*;\n\n    ssl_protocols TLSv1.2 TLSv1.3;\n    ssl_prefer_server_ciphers off;\n    ssl_ciphers \"EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH\";\n\n    upstream backend_app {\n        server backend-api-zoho-senitron:8000;  # Nombre del servicio y puerto configurado en docker-compose.yml\n    }\n\n    server {\n        listen 80;\n        listen [::]:80;\n        # server_name dealerportal.nws.com;\n        server_name 127.0.0.1;\n\n        # Redirige todas las solicitudes HTTP a HTTPS\n        location / {\n            return 301 https://$host$request_uri;\n        }\n    }\n\n    server {\n        listen 443 ssl;\n        listen [::]:443 ssl;\n        # server_name dealerportal.nws.com;\n        server_name 127.0.0.1;\n\n        ssl_certificate /etc/nginx/certificates/DNS/dns_cert.pem;\n        ssl_certificate_key /etc/nginx/certificates/DNS/dns_key.pem;\n        ssl_trusted_certificate /etc/nginx/certificates/DNS/dns_chain.pem;\n        \n        location /static/ {\n            alias /usr/share/nginx/html_backend/;\n            try_files $uri $uri/ /usr/share/nginx/html/$uri =404;\n        }\n\n        # Sirve la aplicación React\n        location / {\n            root /usr/share/nginx/html;\n            try_files $uri $uri/ /index.html;\n        }\n\n        # Rutas de la API Django\n        location /api_zoho_senitron/ {\n            proxy_pass http://backend-api-zoho-senitron:8000;\n            proxy_http_version 1.1;\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n            proxy_set_header X-Forwarded-Host $http_host;\n            proxy_set_header X-Forwarded-Port $server_port;\n\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"upgrade\";\n            proxy_cache_bypass $http_upgrade;\n\n            proxy_read_timeout 120;\n            proxy_connect_timeout 120;\n            proxy_send_timeout 120;\n            send_timeout 120;\n            proxy_ssl_server_name on;\n            proxy_ssl_verify on;\n            proxy_ssl_verify_depth 2;\n        }\n\n        location /api_zoho_senitron/ws/ {\n            proxy_pass http://backend-api-zoho-senitron:8000;\n            proxy_http_version 1.1;\n            proxy_set_header Upgrade $http_upgrade;\n            proxy_set_header Connection \"Upgrade\";\n            proxy_set_header Host $host;\n            proxy_set_header X-Real-IP $remote_addr;\n            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n            proxy_set_header X-Forwarded-Proto $scheme;\n\n            proxy_read_timeout 300s;\n            proxy_send_timeout 300s;\n            send_timeout 300s;\n        }\n\n        error_page 404 /index.html;\n\n        # Redirige HTTP a HTTPS\n        if ($scheme != \"https\") {\n            return 301 https://$host$request_uri;\n        }\n    }\n}"
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: nginx-api-zoho-senitron
  name: nginx-api-zoho-senitron-cm0
