server {
  listen 3030;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- GZIP ---
  gzip on;
  gzip_vary on;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types
      text/plain text/css
      application/javascript application/json
      application/xml application/rss+xml
      image/svg+xml;

  # --- SECURITY HEADERS (opcionales) ---
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # 1) ASSETS CON HASH: cache largo + immutable
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # 2) Otros estáticos (fuentes/imágenes sueltas)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    try_files $uri =404;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # 3) HTML (incluye index.html) -> NO CACHE
  location ~* \.html$ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # 4) SPA fallback -> sirve index.html SIN CACHE
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # (Opcional) si mantienes esta línea, asegúrate de no cachear:
  error_page 404 /index.html;
}


